<style>
  .header-container {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 50px;
    background-color: #f5f5f5;
    border-bottom: 1px solid #ccc;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    box-sizing: border-box;
    z-index: 1000;
    font-family: Arial, sans-serif;
  }

  .menu {
    font-size: 16px;
    cursor: pointer;
    text-decoration: none;
    color: white;
    background-color: #007bff;
    padding: 6px 14px;
    border-radius: 6px;
    border: none;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
  }

  .menu:hover {
    background-color: #0056b3;
  }

  .user-buttons {
    display: flex;
    gap: 10px;
  }

  .user-buttons button {
    padding: 6px 14px;
    font-size: 14px;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid #333;
    background: white;
    color: #333;
    height: 32px;
    white-space: nowrap;
  }

  #register-btn {
    background-color: #007bff;
    color: white;
    border: none !important;
  }

  #register-btn:hover {
    background-color: #0056b3;
  }

  #logout-btn {
    display: none;
    padding: 6px 14px;
    font-size: 14px;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid #333;
    background: white;
    color: #333;
    height: 32px;
    white-space: nowrap;
  }

  #logout-btn:hover {
  background-color: #ddd;
  }

  #logout-btn {
    display: none;
  }
</style>

<div class="header-container">
  <a class="menu" href="/">Menu</a>

  <div class="user-buttons">
    <button onclick="window.location.href='/login.html'" id="login-btn" class="userBtn">Login</button>
    <button onclick="window.location.href='/register.html'" id="register-btn" class="userBtn">Registrar</button>
  </div>
  <button id="logout-btn" style="display:none;">Logout</button>
</div>

<script>
  // Função existente para verificar login
  function isLoggedIn() {
    const token = localStorage.getItem('token');
    if (!token) return false;
    try {
      const payloadBase64 = token.split('.')[1];
      const payloadJson = atob(payloadBase64.replace(/-/g, '+').replace(/_/g, '/'));
      const payload = JSON.parse(payloadJson);
      const now = Math.floor(Date.now() / 1000);
      return payload.exp && payload.exp > now;
    } catch {
      return false;
    }
  }

  // Nova função para monitorar alterações no login
  function setupAuthWatcher() {
    // Verifica a cada 500ms se o estado mudou
    setInterval(updateHeaderButtons, 500);
    
    // Monitora alterações no localStorage
    window.addEventListener('storage', (event) => {
      if (event.key === 'token') {
        updateHeaderButtons();
      }
    });
  }

  // Função existente para atualizar botões
  function updateHeaderButtons() {
    const loggedIn = isLoggedIn();
    document.querySelector('.user-buttons').style.display = loggedIn ? 'none' : 'flex';
    document.getElementById('logout-btn').style.display = loggedIn ? 'inline-block' : 'none';
  }

  // Logout (existente)
  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('token');
    updateHeaderButtons();
    window.location.href = '/';
  });

  // Inicialização
  updateHeaderButtons();
  setupAuthWatcher(); // Adiciona o monitoramento contínuo
</script>
